name: iOS check (unsigned ipa)

on:
  workflow_dispatch:

jobs:
  ios:
    name: iOS build only
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      APPLE_DEVELOPMENT_TEAM: "ABCDE12345"
    steps:
      - uses: actions/checkout@v7

      # iPhone Duo 的显示档位由「二进制链接的 SDK」决定，不是设备系统版本：
      #   iOS 26 SDK 及更早 → 内屏居中显示、四周留白
      #   iOS 27 SDK        → 撑开但非 edge-to-edge
      #   iOS 27.1 SDK      → 真正全屏 edge-to-edge
      # GitHub 托管镜像 xcode-27（macOS 27 / arm64）自带 Xcode 27 工具链，
      # 不再硬指定小版本——镜像里没有的版本会导致 job 直接失败。
      # 实际 SDK 版本见下一步打印。

      - name: 打印工具链版本
        run: |
          xcodebuild -version
          echo "iOS SDK: $(xcrun --sdk iphoneos --show-sdk-version)"
          echo "iOS SDK path: $(xcrun --sdk iphoneos --show-sdk-path)"

      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: swatinem/rust-cache@v2.9.3
        continue-on-error: true
        timeout-minutes: 8
        with:
          workspaces: src-tauri -> target
          key: ios
      - run: pnpm install --frozen-lockfile

      - name: 生成 iOS 工程（带横竖屏 + ATS）
        run: |
          pnpm tauri ios init --ci
          for plist in $(find src-tauri/gen/apple -name "Info.plist" 2>/dev/null); do
            for key in "UISupportedInterfaceOrientations" "UISupportedInterfaceOrientations~iphone" "UISupportedInterfaceOrientations~ipad"; do
              /usr/libexec/PlistBuddy -c "Delete :${key}" "$plist" 2>/dev/null || true
              /usr/libexec/PlistBuddy -c "Add :${key} array" "$plist"
              /usr/libexec/PlistBuddy -c "Add :${key}:0 string UIInterfaceOrientationPortrait" "$plist"
              /usr/libexec/PlistBuddy -c "Add :${key}:1 string UIInterfaceOrientationLandscapeLeft" "$plist"
              /usr/libexec/PlistBuddy -c "Add :${key}:2 string UIInterfaceOrientationLandscapeRight" "$plist"
            done
            # iOS 27 SDK 起 scene 生命周期强制（TN3187）。src-tauri/Info.ios.plist 已在
            # 源头声明，这里幂等再补一次兜底：即使某次 Tauri 不再合并 Info.ios.plist，
            # 也不会出现「装完一启动就被 UIKit 杀掉」。不要写 UISceneConfigurations。
            /usr/libexec/PlistBuddy -c "Delete :UIApplicationSceneManifest" "$plist" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :UIApplicationSceneManifest dict" "$plist"
            /usr/libexec/PlistBuddy -c "Add :UIApplicationSceneManifest:UIApplicationSupportsMultipleScenes bool false" "$plist"
            /usr/libexec/PlistBuddy -c "Delete :NSAppTransportSecurity" "$plist" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$plist"
            /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" "$plist"
          done

      - name: 构建并打包 ipa
        shell: bash
        env:
          APP_VERSION: ${{ github.run_number }}
        run: bash scripts/build-ios-unsigned.sh "$APP_VERSION"

      - uses: actions/upload-artifact@v7
        with:
          name: ios
          path: artifacts/*
          if-no-files-found: error
